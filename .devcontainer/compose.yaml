services:
  homeassistant:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/glitrenett_elbits
      - ./config:/config
      - ../custom_components/glitrenett_elbits:/config/custom_components/glitrenett_elbits:ro
    ports:
      - "8123:8123"
    environment:
      TZ: Etc/UTC
    command: ["sleep", "infinity"]
